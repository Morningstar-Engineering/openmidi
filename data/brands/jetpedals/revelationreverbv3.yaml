cc:
  - name: Set Custom Mix Taper
    value: '17'
    description: >-
      Any value between 0 & 42 sets the custom Mix Taper to 1. Any value between
      43 & 85 sets the custom Mix Taper to 2. Any value between 86 & 127 sets
      the custom Mix Taper to 3.
    type: variable
    min: 0
    max: 127
