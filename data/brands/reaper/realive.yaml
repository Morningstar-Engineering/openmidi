cc:
  - name: Stop (Reset All Projects)
    value: 1
    description: Stops playback and resets all open Realive projects.
    type: fixed
    min: 20
    max: 20
  - name: Stop/GoToPlayStart/GoToSongStart
    value: 1
    description: >-
      Stops playback. Press again to return to the play start position, and
      again to return to the song start.
    type: fixed
    min: 127
    max: 127
  - name: Play/Stop
    value: 2
    description: Toggles playback on and off.
    type: fixed
    min: 20
    max: 20
  - name: Play/Seek
    value: 2
    description: 'Starts playback, or seeks to the selected position if already playing.'
    type: fixed
    min: 40
    max: 40
  - name: Play Only
    value: 2
    description: Starts playback. Has no effect if already playing.
    type: fixed
    min: 127
    max: 127
  - name: Seek (At RegionEnd)
    value: 3
    description: Jumps to the selected position when the current region ends.
    type: fixed
    min: 20
    max: 20
  - name: Seek (With Region Offset)
    value: 3
    description: >-
      Jumps to the selected position while keeping the current offset within the
      region.
    type: fixed
    min: 40
    max: 40
  - name: Seek (Immediately)
    value: 3
    description: Jumps to the selected position right away.
    type: fixed
    min: 60
    max: 60
  - name: Seek (At BarEnd)
    value: 3
    description: Jumps to the selected position at the end of the current bar.
    type: fixed
    min: 127
    max: 127
  - name: Seek To Next Song (Immediately - Stop Current)
    value: 4
    description: Jumps to the next song right away and stops the current song.
    type: fixed
    min: 20
    max: 20
  - name: Seek To Next Song (Immediately - Go to start)
    value: 4
    description: Jumps right away to the start of the next song.
    type: fixed
    min: 40
    max: 40
  - name: Seek To Next Song (Immediately - Go to start - Stop Current)
    value: 4
    description: Jumps right away to the start of the next song and stops the current song.
    type: fixed
    min: 60
    max: 60
  - name: Seek To Next Song (Immediately)
    value: 4
    description: Jumps to the next song right away.
    type: fixed
    min: 127
    max: 127
  - name: Seek To Next Song (At Bar End - Stop Current)
    value: 5
    description: >-
      Jumps to the next song at the end of the current bar and stops the current
      song.
    type: fixed
    min: 20
    max: 20
  - name: Seek To Next Song (At Bar End - Go to start)
    value: 5
    description: Jumps to the start of the next song at the end of the current bar.
    type: fixed
    min: 40
    max: 40
  - name: Seek To Next Song (At Bar End - Go to start - Stop Current)
    value: 5
    description: >-
      Jumps to the start of the next song at the end of the current bar and
      stops the current song.
    type: fixed
    min: 60
    max: 60
  - name: Seek To Next Song (At Bar End)
    value: 5
    description: Jumps to the next song at the end of the current bar.
    type: fixed
    min: 127
    max: 127
  - name: Loop
    value: 7
    description: Toggles looping of the current region on and off.
    type: fixed
    min: 127
    max: 127
  - name: 'LineCheck: Play'
    value: 8
    description: Starts the line check to test audio outputs before a show.
