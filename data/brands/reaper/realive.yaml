    min: 20
    max: 20
  - name: 'LineCheck: Play_ClickOnly'
    value: 8
    description: Starts the line check with the click only.
    type: fixed
    min: 40
    max: 40
  - name: 'LineCheck: Stop'
    value: 8
    description: Stops the line check.
    type: fixed
    min: 127
    max: 127
  - name: 'Song [-]'
