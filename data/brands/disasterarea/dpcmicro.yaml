midi_in: DIN5
midi_thru: Yes
phantom_power: None
midi_clock: No

midi_channel:
  instructions: |+
    MIDI channel 16 by default. To change it, enter MIDI configuration mode (power on, then once the LEDs start flashing hold footswitch C, or LOOP SEL on the NS version) and send a program change from your controller on the desired channel.

cc:
  - name: Loop A
    value: '50'
    description: 'Loop Off: 0-63, Loop On: 64-127. CCs 50-52 apply to Chain ID 0 (default); up to four units can share a channel with Chain IDs 0-3'
    min: 0
    max: 127
    type: variable
  - name: Loop B
    value: '51'
    description: 'Loop Off: 0-63, Loop On: 64-127'
    min: 0
    max: 127
    type: variable
  - name: Loop C
    value: '52'
    description: 'Loop Off: 0-63, Loop On: 64-127'
    min: 0
    max: 127
    type: variable
  - name: Loop A (Chain ID 1)
    value: '53'
    description: 'Loop Off: 0-63, Loop On: 64-127. Used when the DPC Micro is set to MIDI Chain ID 1'
    min: 0
    max: 127
    type: variable
  - name: Loop B (Chain ID 1)
