pc:
  description: |+
    PC 0-119 load user presets (loop combinations saved to internal memory).
    PC 120-127 select fixed loop combinations:
    120: No loops, 121: A, 122: B, 123: A & B, 124: C, 125: A & C, 126: B & C, 127: A & B & C.
