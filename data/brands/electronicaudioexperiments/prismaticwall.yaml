brand: Electronic Audio Experiments
name: Prismatic Wall
midi_in: "Tip Active"
midi_thru: "No"
phantom_power: "No"
midi_clock: "No"
midi_channel: 2
instructions: |+
  To change the MIDI channel: Hold down the Aux button during startup to enter Configuration Mode. Then, send a PC message on your desired channel. The pedal will automatically set itself to that channel.
description: |+
  Sympathetic string resonator designed to behave like an illusory bank of tuned strings vibrating in response to incoming audio.
pc:
  description: |+
    Send PC messages to load corresponding presets (up to 16 presets). To save, hold the Preset button until it enters save state, and it saves to the channel of the next incoming PC message. Alternatively, send PC + 64 to save remotely (e.g., PC 68 to save to preset slot 4). PC 0 reverts to the hardware state.
cc:
  - name: "14 Bit Expression MSB"
    value: 1
    description: "Most Significant Bit for high-precision expression data."
    type: "System"
  - name: "Drive"
    value: 12
    description: "Input gain of the resonator bank."
    type: "Parameter"
  - name: "Mix"
    value: 13
    description: "Sets the blend between the input signal and the resonators."
    type: "Parameter"
  - name: "Damping"
    value: 14
    description: "Changes the sustain for high frequencies."
    type: "Parameter"
  - name: "Decay"
    value: 15
    description: "Changes the sustain for all frequencies."
    type: "Parameter"
  - name: "LFO Rate"
    value: 16
    description: "Adjusts the speed of the LFO modulation."
    type: "Parameter"
  - name: "LFO Amount"
    value: 17
    description: "Adjusts the intensity of the LFO modulation."
    type: "Parameter"
  - name: "Tune"
    value: 18
    description: "Changes the pitch of the entire resonator bank across a four octave range."
    type: "Parameter"
  - name: "Mode"
    value: 19
    description: "Selects interval spacing: 0-15=Single, 16-31=Stacked Neutral 3rd, 32-47=Stacked 5th, 48-63=Chromatic, +64 for +1 Octave Shift versions."
    type: "Parameter"
  - name: "Level Trim"
    value: 20
    description: "Fine tunes the resonator output volume by +/-3dB."
    type: "Parameter"
  - name: "LFO Skew"
    value: 21
    description: "Gradually shapes the LFO into upwards or downwards ramps."
    type: "Parameter"
  - name: "Morph Rise"
    value: 22
    description: "Ramp up time for the Morph function."
    type: "Parameter"
  - name: "Morph Fall"
    value: 23
    description: "Ramp down time for the Morph function."
    type: "Parameter"
  - name: "LFO Rate Multiplier"
    value: 24
    description: "Sets the range of LFO Rate settings (slow, medium, fast, all)."
    type: "Parameter"
  - name: "LFO Shape"
    value: 25
    description: "0-42 = sine, 43-85 = square, 86-127 = triangle."
    type: "Parameter"
  - name: "Quantize"
    value: 26
    description: "0-63 = free, 64-127 = quantized to semitones."
    type: "Parameter"
  - name: "LFO Mode"
    value: 27
