brand: Old Blood Noise Endeavors
model: MTET
device_type: others
url: 'https://www.oldbloodnoise.com/s/Instruction-Manual-MTET-021.pdf'
midi_channel:
  instructions: |+
    MIDI channel 1 from the factory; messages on other channels are ignored.
    To change it, send CC 100 on the current channel with the new channel (1-16) as the value.
    On power-up the EXP 1-4 LEDs blink the current channel number.
midi_thru: 'Yes'
pc:
  description: The manual documents no Program Change messages.
cc:
  - name: Expression 1 MSB
    value: 1
    description: 'Sets Expression out 1. Outputs range 0-255; a CC value v gives 2v unless refined by CC 11'
    type: variable
    min: 0
    max: 127
  - name: Expression 1 LSB
    value: 11
    description: 'Least significant bit for Expression out 1: output = CC 1 value * 2 + this value'
    type: variable
    min: 0
    max: 1
  - name: Expression 2 MSB
    value: 2
    description: 'Sets Expression out 2. Outputs range 0-255; a CC value v gives 2v unless refined by CC 12'
    type: variable
    min: 0
    max: 127
  - name: Expression 2 LSB
    value: 12
    description: 'Least significant bit for Expression out 2: output = CC 2 value * 2 + this value'
    type: variable
    min: 0
    max: 1
  - name: Expression 3 MSB
    value: 3
    description: 'Sets Expression out 3. Outputs range 0-255; a CC value v gives 2v unless refined by CC 13'
    type: variable
    min: 0
    max: 127
  - name: Expression 3 LSB
    value: 13
    description: 'Least significant bit for Expression out 3: output = CC 3 value * 2 + this value'
    type: variable
    min: 0
    max: 1
  - name: Expression 4 MSB
    value: 4
    description: 'Sets Expression out 4. Outputs range 0-255; a CC value v gives 2v unless refined by CC 14'
    type: variable
    min: 0
    max: 127
  - name: Expression 4 LSB
    value: 14
    description: 'Least significant bit for Expression out 4: output = CC 4 value * 2 + this value'
    type: variable
    min: 0
    max: 1
  - name: MIDI Channel Assignment
    value: 100
    description: 'Send on the current channel with the new channel (1-16) as the value. The EXP 1-4 LEDs blink the new channel number'
    type: variable
    min: 1
    max: 16
