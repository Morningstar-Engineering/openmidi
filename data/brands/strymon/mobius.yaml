midi_channel:
  instructions: >
    Push and hold the Value knob to go into the Global Settings Menu.

    From there, turn the knob until you see MIDICH. Press the Value knob to
    select that option. You will now be able

    to select the MIDI channel for your device.


    Turn the knob to your desired channel. Once done, press the Value knob again
    to save the channel.
midi_inputs:
  - name: MIDI IN
    type: 5pin
midi_outputs: []
midi_thru: 'Yes'
pc:
  description: >
    Mobius presets are arranged in a grid of 100 numbered Banks (00-99) with 2
    presets (A and B) within each Bank for

    a total of 200 presets.


    Because MIDI Program Change messages have a maximum number of 128 (0-127),
    the presets are grouped into 2 MIDI

    Patch Banks:

    MIDI BANK 0 = PRESETS 00A-63B

    MIDI BANK 1 = PRESETS 64A-99B


    The presets are numbered sequentially within each bank:

    PRESET 00A = MIDI program # 0

    PRESET 00B = MIDI program # 1

    PRESET 01A = MIDI program # 2

    PRESET 01B = MIDI program # 3

    PRESET 02A = MIDI program # 4 etc. up to #127...


    Mobius always powers up in MIDI Patch Bank 0, so if you plan to stay within
    the first 127 presets (00A-63B),

    simply send a standard MIDI Program Change message to load a preset.


    If you will be using MIDI Bank 1, it is advisable to send a standard MIDI
    Bank Change message [MIDI CC# 0 with a

    value equal to the MIDI Bank #] before each MIDI Program Change.
