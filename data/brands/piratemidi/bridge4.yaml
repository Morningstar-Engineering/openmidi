brand: Pirate MIDI
model: Bridge4
device_type: midi_controller
url: 'https://learn.piratemidi.com/downloads/user-manuals'
midi_clock: 'Yes'
midi_thru: 'Yes'
midi_inputs:
  - name: MIDI IN
    type: trs_type_a_3.5mm
  - name: USB
    type: usb_device
midi_outputs:
  - name: MIDI OUT
    type: trs_type_a_3.5mm
  - name: Flexiport 1 (MIDI Out mode Type A, Type B, Tip Active or Ring Active; also exp, aux switch and clock modes)
    type: trs_type_a_6.35mm
  - name: Flexiport 2 (MIDI Out mode Type A, Type B, Tip Active or Ring Active; also exp, aux switch and clock modes)
    type: trs_type_a_6.35mm
midi_channel:
  instructions: |+
    Omni by default (responds to any channel). Set a fixed channel in Menu > Global > MIDI > Channel, e.g. 16 if other messages should pass thru without controlling the Bridge4.
pc:
  description: |+
    PC 0-99 goes to bank 0-99.
cc:
  - name: FS1 Action
    value: 0
    description: '0 = off, 127 = on, 64 = toggle, 3 = press action, 4 = release action, 5 = double press action, 6 = hold action, 7 = hold release action, 20/21/22/23 = sequential increment/decrement/next/reset, 30/31/32/33 = scrolling increment/decrement/next/reset'
    type: group
    min: 0
    max: 127
  - name: FS2 Action
    value: 1
    description: '0 = off, 127 = on, 64 = toggle, 3 = press action, 4 = release action, 5 = double press action, 6 = hold action, 7 = hold release action, 20/21/22/23 = sequential increment/decrement/next/reset, 30/31/32/33 = scrolling increment/decrement/next/reset'
    type: group
    min: 0
    max: 127
