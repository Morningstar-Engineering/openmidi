brand: The GigRig
device_name: Wet/Dry Machine
midi_channel:
  instructions: 'Use the white mini potentiometer on the back of the unit to set the MIDI channel. 1~9 selects channels 1~9, A~F selects MIDI channels 10~15.'
midi_clock: 'No'
midi_in: 'DIN5'
midi_thru: 'Yes'
pc:
  description: |+
    Program 1 activates Output 1 and deactivates all other outputs.
    Program 2 activates Output 2 and deactivates all other outputs.
    Program 3 activates Output 3 and deactivates all other outputs.
    Program 4 activates Output 4 and deactivates all other outputs.
    Program 5 deactivates all output channels.
    Programs 10 through 25 activate or deactivate outputs according to a fixed binary pattern, allowing direct control of multiple outputs
    simultaneously. The output states for each program number are as follows:
    Program 10: Outputs 1, 2, 3 and 4 inactive
    Program 11: Output 1 active, others inactive
    Program 12: Output 2 active, others inactive
    Program 13: Outputs 1 and 2 active
    Program 14: Output 3 active, others inactive
    Program 15: Outputs 1 and 3 active
    Program 16: Outputs 2 and 3 active
    Program 17: Outputs 1, 2 and 3 active
    Program 18: Output 4 active, others inactive
    Program 19: Outputs 1 and 4 active
    Program 20: Outputs 2 and 4 active
    Program 21: Outputs 1, 2 and 4 active
    Program 22: Outputs 3 and 4 active
    Program 23: Outputs 1, 3 and 4 active
    Program 24: Outputs 2, 3 and 4 active
    Program 25: Outputs 1, 2, 3 and 4 active
    Program messages 10 through 25 override Flip/Flop mode. LED colours may not reflect Flip/Flop status when
    these program messages are used.
    All other MIDI messages are ignored. Messages received on other MIDI channels are also ignored.
phantom_power: ''
cc:
  - name: Output 1
    value: '80'
    description: 64-127 activates the output, 63 and lower disables it.
    min: 0
    max: 127
    type: variable
  - name: Output 2
    value: '81'
    description: 64-127 activates the output, 63 and lower disables it.
    min: 0
    max: 127
    type: variable
  - name: Output 3
    value: '82'
    description: 64-127 activates the output, 63 and lower disables it.
    min: 0
    max: 127
    type: variable
  - name: Output 4
    value: '83'
    description: 64-127 activates the output, 63 and lower disables it.
    min: 0
    max: 127
    type: variable
  - name: All Controllers Off
    value: '121'
    description: Send any value to turn off all outputs.
    min: 0
    max: 127
    type: variable
